version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quanlycv_postgres
    restart: always
    environment:
      POSTGRES_USER: quanlycv_user
      POSTGRES_PASSWORD: quanlycv_password
      POSTGRES_DB: quanlycv_db
    ports:
      - "5433:5432"
    volumes:
      - quanlycv_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: quanlycv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - quanlycv_redis_data:/data

volumes:
  quanlycv_postgres_data:
  quanlycv_redis_data:
